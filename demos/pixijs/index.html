<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tank Game - PixiJS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; }
  canvas { display: block; cursor: crosshair; }
  #info { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    color: #aaa; font-family: monospace; font-size: 11px; background: rgba(0,0,0,0.6);
    padding: 4px 10px; border-radius: 4px; z-index: 10; white-space: nowrap; }
</style>
</head>
<body>
<div id="info">WASD move | Mouse aim | Click shoot | 1-3 missiles</div>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
<script>
(async () => {

// ============================================================
// NOISE UTILITIES
// ============================================================
function makeNoise(seed) {
  function hash(x, y) {
    let h = (x * 374761393 + y * 668265263 + seed) & 0x7fffffff;
    h = ((h >> 13) ^ h) * 1274126177;
    return ((h >> 16) ^ h) & 0x7fffffff;
  }
  function noise2d(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    const n00 = hash(ix, iy) / 0x7fffffff;
    const n10 = hash(ix+1, iy) / 0x7fffffff;
    const n01 = hash(ix, iy+1) / 0x7fffffff;
    const n11 = hash(ix+1, iy+1) / 0x7fffffff;
    return (n00*(1-sx)+n10*sx)*(1-sy) + (n01*(1-sx)+n11*sx)*sy;
  }
  function fbm(x, y, octaves) {
    let val = 0, amp = 1, freq = 1, max = 0;
    for (let i = 0; i < octaves; i++) {
      val += noise2d(x * freq, y * freq) * amp;
      max += amp; amp *= 0.5; freq *= 2;
    }
    return val / max;
  }
  return { noise2d, fbm };
}

const N = makeNoise(1274126177);

// ============================================================
// SAND GENERATOR — Ridge Noise
// ============================================================
function generateSandTile(w, h, wx, wy) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(w, h);
  const d = img.data;
  for (let py = 0; py < h; py++) {
    for (let px = 0; px < w; px++) {
      const i = (py * w + px) * 4;
      const x = wx + px, y = wy + py;
      const dune = N.fbm(x * 0.003, y * 0.003, 4) * 30;
      const rippleNoise = N.fbm(x * 0.005 + 20, y * 0.025 + 20, 4);
      const ridge = 1.0 - Math.abs(rippleNoise * 2 - 1);
      const v = dune + Math.pow(ridge, 3) * 20;
      const grain = (Math.random() - 0.5) * 6;
      d[i]   = Math.min(255, Math.max(0, 192 + v + grain));
      d[i+1] = Math.min(255, Math.max(0, 164 + (v + grain) * 0.85));
      d[i+2] = Math.min(255, Math.max(0, 110 + (v + grain) * 0.55));
      d[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

// ============================================================
// PIXI APP
// ============================================================
const app = new PIXI.Application();
await app.init({
  width: window.innerWidth, height: window.innerHeight,
  backgroundColor: 0xb8a472, antialias: false,
  resolution: window.devicePixelRatio || 1, autoDensity: true,
});
document.body.appendChild(app.canvas);
app.canvas.style.cursor = 'crosshair';
window.addEventListener('resize', () => app.renderer.resize(window.innerWidth, window.innerHeight));

const WORLD_W = 3000, WORLD_H = 3000;
const TILE_SIZE = 512;
const world = new PIXI.Container();
app.stage.addChild(world);

// ============================================================
// GENERATE SAND TILES
// ============================================================
for (let x = 0; x < WORLD_W; x += TILE_SIZE) {
  for (let y = 0; y < WORLD_H; y += TILE_SIZE) {
    const tileW = Math.min(TILE_SIZE, WORLD_W - x);
    const tileH = Math.min(TILE_SIZE, WORLD_H - y);
    const sandCanvas = generateSandTile(tileW, tileH, x, y);
    const tile = new PIXI.Sprite(PIXI.Texture.from(sandCanvas));
    tile.x = x; tile.y = y;
    world.addChild(tile);
  }
}

// Dune shadow overlays
const duneShadowPositions = [
  { x: 500, y: 400, w: 500, h: 250 },
  { x: 1400, y: 700, w: 600, h: 300 },
  { x: 800, y: 1600, w: 550, h: 280 },
  { x: 2200, y: 500, w: 450, h: 220 },
  { x: 1900, y: 2000, w: 600, h: 320 },
  { x: 2500, y: 1400, w: 400, h: 200 },
];
for (const p of duneShadowPositions) {
  const g = new PIXI.Graphics();
  g.ellipse(0, 0, p.w/2, p.h/2);
  g.fill({ color: 0x000000, alpha: 0.08 });
  g.x = p.x; g.y = p.y;
  world.addChild(g);
}

// ============================================================
// SPRITE GENERATORS
// ============================================================
function hexToRgb(hex) { return { r: (hex>>16)&0xff, g: (hex>>8)&0xff, b: hex&0xff }; }
function lighten(c, a) { let r=(c>>16)&0xff,g=(c>>8)&0xff,b=c&0xff; return ((Math.min(255,r+a)<<16)|(Math.min(255,g+a)<<8)|Math.min(255,b+a)); }
function darken(c, a) { let r=(c>>16)&0xff,g=(c>>8)&0xff,b=c&0xff; return ((Math.max(0,r-a)<<16)|(Math.max(0,g-a)<<8)|Math.max(0,b-a)); }

function createTankTexture(bodyColor, scale = 1) {
  const c = document.createElement('canvas');
  const s = scale;
  const w = Math.ceil(44*s), h = Math.ceil(52*s);
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const cx = w/2, cy = h/2;
  const rgb = hexToRgb(bodyColor);
  const dk = hexToRgb(darken(bodyColor, 50));
  const lt = hexToRgb(lighten(bodyColor, 35));

  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(cx+2, cy+3, 18*s, 20*s, 0, 0, Math.PI*2); ctx.fill();

  for (const dir of [-1, 1]) {
    const tx = cx + dir * 14 * s;
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(tx-5*s, cy-22*s, 10*s, 44*s);
    ctx.strokeStyle = '#444'; ctx.lineWidth = 0.8;
    for (let i = -20; i < 22; i += 4) {
      ctx.beginPath(); ctx.moveTo(tx-5*s, cy+i*s); ctx.lineTo(tx+5*s, cy+i*s); ctx.stroke();
    }
  }

  const bg = ctx.createLinearGradient(cx-12*s, cy, cx+12*s, cy);
  bg.addColorStop(0, `rgb(${dk.r},${dk.g},${dk.b})`);
  bg.addColorStop(0.3, `rgb(${lt.r},${lt.g},${lt.b})`);
  bg.addColorStop(0.7, `rgb(${rgb.r},${rgb.g},${rgb.b})`);
  bg.addColorStop(1, `rgb(${dk.r},${dk.g},${dk.b})`);
  ctx.fillStyle = bg;
  ctx.fillRect(cx-12*s, cy-16*s, 24*s, 32*s);
  ctx.strokeStyle = `rgb(${Math.max(0,dk.r-20)},${Math.max(0,dk.g-20)},${Math.max(0,dk.b-20)})`;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(cx-12*s, cy-16*s, 24*s, 32*s);

  const tg = ctx.createRadialGradient(cx-2*s, cy-2*s, 1, cx, cy, 11*s);
  tg.addColorStop(0, `rgb(${Math.min(255,lt.r+20)},${Math.min(255,lt.g+20)},${Math.min(255,lt.b+20)})`);
  tg.addColorStop(0.6, `rgb(${rgb.r},${rgb.g},${rgb.b})`);
  tg.addColorStop(1, `rgb(${dk.r},${dk.g},${dk.b})`);
  ctx.fillStyle = tg; ctx.beginPath(); ctx.arc(cx, cy, 11*s, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = `rgb(${Math.max(0,dk.r-10)},${Math.max(0,dk.g-10)},${Math.max(0,dk.b-10)})`;
  ctx.lineWidth = 1.5; ctx.stroke();

  const ig = ctx.createRadialGradient(cx-1*s, cy-1*s, 0, cx, cy, 7*s);
  ig.addColorStop(0, `rgba(${lt.r},${lt.g},${lt.b},0.8)`);
  ig.addColorStop(1, `rgb(${Math.max(0,dk.r+10)},${Math.max(0,dk.g+10)},${Math.max(0,dk.b+10)})`);
  ctx.fillStyle = ig; ctx.beginPath(); ctx.arc(cx, cy, 7*s, 0, Math.PI*2); ctx.fill();

  return PIXI.Texture.from(c);
}

function createTurretTexture() {
  const c = document.createElement('canvas'); c.width = 12; c.height = 36;
  const ctx = c.getContext('2d');
  const cx = 6;
  ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(cx-3+1, 2, 6, 28);
  const bg = ctx.createLinearGradient(cx-3, 0, cx+3, 0);
  bg.addColorStop(0, '#333'); bg.addColorStop(0.4, '#666'); bg.addColorStop(0.6, '#555'); bg.addColorStop(1, '#2a2a2a');
  ctx.fillStyle = bg; ctx.fillRect(cx-3, 0, 6, 28);
  ctx.strokeStyle = '#222'; ctx.lineWidth = 0.8; ctx.strokeRect(cx-3, 0, 6, 28);
  ctx.fillStyle = '#222'; ctx.fillRect(cx-4, 0, 8, 4);
  ctx.fillStyle = '#555'; ctx.fillRect(cx-3.5, 20, 7, 2);
  return PIXI.Texture.from(c);
}

function createTreeTexture() {
  const c = document.createElement('canvas'); c.width = 48; c.height = 48;
  const ctx = c.getContext('2d');
  const cx = 24, cy = 26;
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(cx+2, cy+8, 16, 10, 0.1, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#5a3518'; ctx.fillRect(cx-2, cy, 4, 10);
  for (const l of [{x:0,y:-8,r:10,c:'#1e7a2e'},{x:-9,y:-4,r:8,c:'#237a30'},{x:9,y:-3,r:8,c:'#1f6e28'},
    {x:-5,y:-14,r:7,c:'#2a8838'},{x:5,y:-12,r:7,c:'#268432'},{x:0,y:-16,r:6,c:'#2e9040'}]) {
    ctx.fillStyle = l.c; ctx.beginPath(); ctx.arc(cx+l.x, cy+l.y, l.r, 0, Math.PI*2); ctx.fill();
  }
  for (const h of [{x:-3,y:-12,r:5,c:'#3aaa4a'},{x:4,y:-8,r:4,c:'#42b050'},{x:-7,y:-6,r:3,c:'#38a644'},{x:1,y:-17,r:3,c:'#4abb56'}]) {
    ctx.fillStyle = h.c; ctx.beginPath(); ctx.arc(cx+h.x, cy+h.y, h.r, 0, Math.PI*2); ctx.fill();
  }
  return PIXI.Texture.from(c);
}

function createRockTexture() {
  const c = document.createElement('canvas'); c.width = 40; c.height = 40;
  const ctx = c.getContext('2d'); const cx = 20, cy = 20;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(cx+3, cy+5, 14, 10, 0.1, 0, Math.PI*2); ctx.fill();
  const rg = ctx.createRadialGradient(cx-3, cy-4, 2, cx, cy, 12);
  rg.addColorStop(0, '#a89880'); rg.addColorStop(0.5, '#8a7a68'); rg.addColorStop(1, '#6a5a48');
  ctx.fillStyle = rg;
  ctx.beginPath(); ctx.moveTo(cx-10,cy+4); ctx.quadraticCurveTo(cx-12,cy-6,cx-3,cy-10);
  ctx.quadraticCurveTo(cx+4,cy-12,cx+10,cy-6); ctx.quadraticCurveTo(cx+14,cy+1,cx+10,cy+5);
  ctx.quadraticCurveTo(cx+3,cy+8,cx-10,cy+4); ctx.fill();
  ctx.fillStyle = 'rgba(180,170,150,0.4)';
  ctx.beginPath(); ctx.ellipse(cx-2,cy-4,5,3,-0.3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#7a6a58'; ctx.beginPath(); ctx.arc(cx-7,cy+7,3.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+9,cy+8,2.5,0,Math.PI*2); ctx.fill();
  return PIXI.Texture.from(c);
}

function createMineTexture() {
  const c = document.createElement('canvas'); c.width = 32; c.height = 32;
  const ctx = c.getContext('2d'); const cx = 16, cy = 16;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(cx+2,cy+3,10,7,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#4a3a28';
  for (let a = 0; a < Math.PI*2; a += Math.PI/3) {
    ctx.beginPath(); ctx.arc(cx+Math.cos(a)*10,cy+Math.sin(a)*10,3.5,0,Math.PI*2); ctx.fill();
  }
  const mg = ctx.createRadialGradient(cx-3,cy-3,1,cx,cy,9);
  mg.addColorStop(0,'#8a6a40'); mg.addColorStop(0.6,'#6a4a28'); mg.addColorStop(1,'#3a2a18');
  ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(cx,cy,8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(200,180,140,0.3)';
  ctx.beginPath(); ctx.arc(cx-2,cy-3,3,0,Math.PI*2); ctx.fill();
  return PIXI.Texture.from(c);
}

function createMinimapFrame() {
  const c = document.createElement('canvas'); const sz = 160; c.width = sz; c.height = sz;
  const ctx = c.getContext('2d'); const cx = sz/2, cy = sz/2, r = sz/2-4;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.arc(cx+2,cy+2,r+4,0,Math.PI*2); ctx.fill();
  const og = ctx.createRadialGradient(cx-10,cy-10,r*0.7,cx,cy,r+3);
  og.addColorStop(0,'#c4a456'); og.addColorStop(0.5,'#8a6a30'); og.addColorStop(0.8,'#6a5020'); og.addColorStop(1,'#4a3818');
  ctx.fillStyle = og; ctx.beginPath(); ctx.arc(cx,cy,r+3,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#3a2810'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx,cy,r-2,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#a88838';
  for (let a = 0; a < Math.PI*2; a += Math.PI/6) {
    const bx = cx+Math.cos(a)*(r-1), by = cy+Math.sin(a)*(r-1);
    ctx.beginPath(); ctx.arc(bx,by,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#c4a456'; ctx.beginPath(); ctx.arc(bx-0.5,by-0.5,1.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#a88838';
  }
  return PIXI.Texture.from(c);
}

// ============================================================
// SPAWN WORLD OBJECTS
// ============================================================
const treeTex = createTreeTexture();
const rockTex = createRockTexture();
const mineTex = createMineTexture();
const playerBodyTex = createTankTexture(0x4488bb);
const turretTex = createTurretTexture();

const clans = [
  { color: 0xcc3333, name: 'Red Legion' },
  { color: 0xcc8833, name: 'Desert Wolves' },
  { color: 0x8833cc, name: 'Shadow Clan' },
  { color: 0x33cc33, name: 'Viper Squad' }
];
const clanTex = {};
for (const c of clans) clanTex[c.color] = createTankTexture(c.color, 0.9);

const treeData = [];
for (let i = 0; i < 80; i++) {
  const s = new PIXI.Sprite(treeTex); s.anchor.set(0.5);
  s.x = 100+Math.random()*(WORLD_W-200); s.y = 100+Math.random()*(WORLD_H-200);
  s.scale.set(0.8+Math.random()*0.5); world.addChild(s); treeData.push(s);
}
for (let i = 0; i < 35; i++) {
  const s = new PIXI.Sprite(rockTex); s.anchor.set(0.5);
  s.x = 100+Math.random()*(WORLD_W-200); s.y = 100+Math.random()*(WORLD_H-200);
  s.scale.set(0.7+Math.random()*0.8); world.addChild(s);
}
for (let i = 0; i < 20; i++) {
  const s = new PIXI.Sprite(mineTex); s.anchor.set(0.5);
  s.x = 150+Math.random()*(WORLD_W-300); s.y = 150+Math.random()*(WORLD_H-300);
  s.scale.set(0.8+Math.random()*0.4); world.addChild(s);
}

// Player
const player = { x: WORLD_W/2, y: WORLD_H/2, angle: 0, turretAngle: 0, hp: 100, maxHp: 100, missileType: 0 };
const playerContainer = new PIXI.Container();
const playerBody = new PIXI.Sprite(playerBodyTex); playerBody.anchor.set(0.5);
const playerTurret = new PIXI.Sprite(turretTex); playerTurret.anchor.set(0.5, 0.8);
playerContainer.addChild(playerBody); playerContainer.addChild(playerTurret);
world.addChild(playerContainer);

// Enemies
const enemies = [];
for (let i = 0; i < 20; i++) {
  const clan = clans[i % clans.length];
  let ex, ey;
  do { ex = 200+Math.random()*(WORLD_W-400); ey = 200+Math.random()*(WORLD_H-400); }
  while (Math.hypot(ex-WORLD_W/2, ey-WORLD_H/2) < 400);
  const cont = new PIXI.Container();
  const body = new PIXI.Sprite(clanTex[clan.color]); body.anchor.set(0.5);
  const turr = new PIXI.Sprite(turretTex); turr.anchor.set(0.5, 0.8); turr.scale.set(0.9);
  cont.addChild(body); cont.addChild(turr);
  cont.x = ex; cont.y = ey; world.addChild(cont);
  const hpBg = new PIXI.Graphics();
  hpBg.rect(-20,-32,40,4); hpBg.fill({color:0x000000,alpha:0.6}); cont.addChild(hpBg);
  const hpBar = new PIXI.Graphics(); cont.addChild(hpBar);
  const label = new PIXI.Text({text:clan.name,style:{fontSize:9,fill:0xffffff,fontFamily:'monospace'}});
  label.anchor.set(0.5); label.y = -39; label.alpha = 0.8; cont.addChild(label);
  enemies.push({
    container:cont, body, turret:turr, hpBar,
    x:ex, y:ey, angle:Math.random()*Math.PI*2, turretAngle:Math.random()*Math.PI*2,
    hp:60, maxHp:60, alive:true, clan,
    ai:{state:'patrol',timer:0,targetAngle:Math.random()*Math.PI*2,shootTimer:0}
  });
}

// Projectile/particle layers
const particleContainer = new PIXI.Container();
const projectileContainer = new PIXI.Container();
world.addChild(particleContainer); world.addChild(projectileContainer);
world.removeChild(playerContainer); world.addChild(playerContainer);

const missileTypes = [
  { name:'Standard', color:0xffcc00, speed:8, damage:20, size:4, reload:300 },
  { name:'Rocket', color:0xff4444, speed:6, damage:45, size:6, reload:600 },
  { name:'Plasma', color:0x44ffaa, speed:10, damage:15, size:3, reload:150 }
];
let lastShot = 0;

// ============================================================
// HUD
// ============================================================
const hud = new PIXI.Container(); app.stage.addChild(hud);
const mmSize = 140;
const mmFrameTex = createMinimapFrame();
const mmFrame = new PIXI.Sprite(mmFrameTex); mmFrame.anchor.set(0.5);
const mmBg = new PIXI.Graphics();
const mmContent = new PIXI.Graphics();
hud.addChild(mmBg); hud.addChild(mmContent); hud.addChild(mmFrame);

const hudHpBg = new PIXI.Graphics();
const hudHpFill = new PIXI.Graphics();
const hudHpText = new PIXI.Text({text:'HP: 100/100',style:{fontSize:12,fill:0xffffff,fontFamily:'monospace'}});
hud.addChild(hudHpBg); hud.addChild(hudHpFill); hud.addChild(hudHpText);
const hudMissile = new PIXI.Text({text:'[1] Standard',style:{fontSize:12,fill:0xffffff,fontFamily:'monospace'}});
hud.addChild(hudMissile);
const hudEnemy = new PIXI.Text({text:'Enemies: 20/20',style:{fontSize:12,fill:0xff8888,fontFamily:'monospace'}});
hud.addChild(hudEnemy);

// ============================================================
// INPUT
// ============================================================
const keys = {};
let mouseX = 0, mouseY = 0;
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (['1','2','3'].includes(e.key)) player.missileType = parseInt(e.key)-1; });
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
window.addEventListener('mousedown', () => keys['mouse'] = true);
window.addEventListener('mouseup', () => keys['mouse'] = false);

// ============================================================
// PROJECTILES & PARTICLES
// ============================================================
const projectiles = [];
const particles = [];

function spawnProjectile(x, y, angle, mt, owner, color) {
  const g = new PIXI.Graphics();
  const c = color || mt.color;
  g.circle(0,0,mt.size*2); g.fill({color:c,alpha:0.15});
  g.circle(0,0,mt.size); g.fill(c);
  g.circle(0,0,mt.size*0.4); g.fill(0xffffff);
  g.x = x+Math.cos(angle)*30; g.y = y+Math.sin(angle)*30;
  projectileContainer.addChild(g);
  projectiles.push({graphic:g, vx:Math.cos(angle)*mt.speed, vy:Math.sin(angle)*mt.speed,
    damage:mt.damage, life:120, owner, size:mt.size});
}

function spawnParticle(x, y, color, size, life) {
  const g = new PIXI.Graphics(); g.circle(0,0,size); g.fill(color);
  g.x = x; g.y = y; particleContainer.addChild(g);
  const a = Math.random()*Math.PI*2, spd = 1+Math.random()*3;
  particles.push({graphic:g, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd, life, maxLife:life});
}

function spawnExplosion(x, y, count) {
  const colors = [0xff4400,0xffaa00,0xffcc44,0xff6600];
  for (let i = 0; i < count; i++)
    spawnParticle(x, y, colors[Math.floor(Math.random()*4)], 2+Math.random()*4, 15+Math.random()*20);
}

// ============================================================
// GAME LOOP
// ============================================================
app.ticker.add(() => {
  let mx = 0, my = 0;
  if (keys['w']||keys['arrowup']) my -= 1;
  if (keys['s']||keys['arrowdown']) my += 1;
  if (keys['a']||keys['arrowleft']) mx -= 1;
  if (keys['d']||keys['arrowright']) mx += 1;
  if (mx||my) {
    const a = Math.atan2(my, mx);
    player.angle = a;
    player.x += Math.cos(a)*3; player.y += Math.sin(a)*3;
    player.x = Math.max(30, Math.min(WORLD_W-30, player.x));
    player.y = Math.max(30, Math.min(WORLD_H-30, player.y));
  }

  const camX = player.x - app.screen.width/2;
  const camY = player.y - app.screen.height/2;
  world.x = -camX; world.y = -camY;

  const wmx = mouseX+camX, wmy = mouseY+camY;
  player.turretAngle = Math.atan2(wmy-player.y, wmx-player.x) + Math.PI/2;
  playerContainer.x = player.x; playerContainer.y = player.y;
  playerBody.rotation = player.angle + Math.PI/2;
  playerTurret.rotation = player.turretAngle;

  const now = Date.now();
  if ((keys['mouse']||keys[' ']) && now-lastShot > missileTypes[player.missileType].reload) {
    lastShot = now;
    const mt = missileTypes[player.missileType];
    const a = player.turretAngle - Math.PI/2;
    spawnProjectile(player.x, player.y, a, mt, 'player');
  }

  for (const e of enemies) {
    if (!e.alive) continue;
    const dist = Math.hypot(e.x-player.x, e.y-player.y);
    e.ai.timer--;
    if (dist < 500) e.ai.state = 'attack';
    else if (e.ai.timer <= 0) { e.ai.state='patrol'; e.ai.targetAngle=Math.random()*Math.PI*2; e.ai.timer=60+Math.random()*120; }

    if (e.ai.state === 'patrol') {
      e.x += Math.cos(e.ai.targetAngle)*1; e.y += Math.sin(e.ai.targetAngle)*1;
      e.angle = e.ai.targetAngle;
    } else {
      const atp = Math.atan2(player.y-e.y, player.x-e.x);
      e.turretAngle = atp + Math.PI/2;
      if (dist > 200) { e.x += Math.cos(atp)*1.5; e.y += Math.sin(atp)*1.5; e.angle = atp; }
      e.ai.shootTimer--;
      if (e.ai.shootTimer <= 0 && dist < 500) {
        e.ai.shootTimer = 40+Math.random()*40;
        const a = e.turretAngle - Math.PI/2;
        spawnProjectile(e.x, e.y, a, {speed:5,damage:10,size:3,reload:0}, 'enemy', e.clan.color);
      }
    }
    e.x = Math.max(30, Math.min(WORLD_W-30, e.x));
    e.y = Math.max(30, Math.min(WORLD_H-30, e.y));
    e.container.x = e.x; e.container.y = e.y;
    e.body.rotation = e.angle + Math.PI/2;
    e.turret.rotation = e.turretAngle;
    e.hpBar.clear();
    e.hpBar.rect(-20,-32,(e.hp/e.maxHp)*40,4);
    e.hpBar.fill(e.hp > e.maxHp*0.5 ? 0x44cc44 : e.hp > e.maxHp*0.25 ? 0xcccc44 : 0xcc4444);
  }

  for (let i = projectiles.length-1; i >= 0; i--) {
    const p = projectiles[i];
    p.graphic.x += p.vx; p.graphic.y += p.vy; p.life--;
    if (p.life <= 0) { projectileContainer.removeChild(p.graphic); projectiles.splice(i,1); continue; }
    if (p.owner === 'player') {
      for (const e of enemies) {
        if (!e.alive) continue;
        if (Math.hypot(p.graphic.x-e.x, p.graphic.y-e.y) < 22) {
          e.hp -= p.damage; spawnExplosion(p.graphic.x, p.graphic.y, 8);
          if (e.hp <= 0) { e.alive=false; e.container.visible=false; spawnExplosion(e.x,e.y,25); }
          projectileContainer.removeChild(p.graphic); projectiles.splice(i,1); break;
        }
      }
    }
    if (p.owner === 'enemy' && Math.hypot(p.graphic.x-player.x, p.graphic.y-player.y) < 22) {
      player.hp -= p.damage; spawnExplosion(p.graphic.x, p.graphic.y, 6);
      projectileContainer.removeChild(p.graphic); projectiles.splice(i,1);
      if (player.hp <= 0) { player.hp=player.maxHp; player.x=WORLD_W/2; player.y=WORLD_H/2; }
    }
  }

  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.graphic.x += p.vx; p.graphic.y += p.vy; p.life--;
    p.graphic.alpha = p.life/p.maxLife;
    if (p.life <= 0) { particleContainer.removeChild(p.graphic); particles.splice(i,1); }
  }

  const sw = app.screen.width, sh = app.screen.height;
  const mmCX = sw-mmSize/2-20, mmCY = mmSize/2+20;
  mmFrame.x = mmCX; mmFrame.y = mmCY; mmFrame.scale.set(mmSize/140*1.14);
  mmBg.clear(); mmBg.circle(mmCX,mmCY,mmSize/2-8); mmBg.fill(0x9a8a5a);
  mmContent.clear();
  const mmx = mmCX-mmSize/2+8, mmy = mmCY-mmSize/2+8, mmw = mmSize-16, mmh = mmSize-16;
  for (const t of treeData) { mmContent.rect(mmx+(t.x/WORLD_W)*mmw-1,mmy+(t.y/WORLD_H)*mmh-1,2,2); mmContent.fill(0x3a7a3a); }
  for (const e of enemies) { if (!e.alive) continue; mmContent.rect(mmx+(e.x/WORLD_W)*mmw-2,mmy+(e.y/WORLD_H)*mmh-2,4,4); mmContent.fill(0xcc3333); }
  mmContent.rect(mmx+(player.x/WORLD_W)*mmw-3,mmy+(player.y/WORLD_H)*mmh-3,6,6); mmContent.fill(0x33aaff);

  hudHpBg.clear(); hudHpBg.rect(15,sh-45,204,24); hudHpBg.fill({color:0x000000,alpha:0.6});
  hudHpFill.clear(); hudHpFill.rect(17,sh-43,(player.hp/player.maxHp)*200,20);
  hudHpFill.fill(player.hp>50?0x44cc44:player.hp>25?0xcccc44:0xcc4444);
  hudHpText.text = `HP: ${player.hp}/${player.maxHp}`; hudHpText.x=22; hudHpText.y=sh-42;
  hudMissile.text = `[${player.missileType+1}] ${missileTypes[player.missileType].name}`; hudMissile.x=22; hudMissile.y=sh-72;
  const alive = enemies.filter(e=>e.alive).length;
  hudEnemy.text = `Enemies: ${alive}/${enemies.length}`; hudEnemy.x=22; hudEnemy.y=sh-100;
});

})();
</script>
</body>
</html>
